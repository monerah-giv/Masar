name: Deploy site

# Publishes dist/site (the standalone app that can read the device location) to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["data/**", "web/**", "tools/**", "brand/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install --disable-pip-version-check pillow reportlab

      - name: Build
        run: python3 tools/build.py

      - name: Test before publishing
        run: |
          python3 -m unittest discover -s tests
          node --test tests/engine.test.mjs tests/ads.test.mjs tests/admin.test.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
