name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Data, engine and build checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependency (icons)
        run: pip install --disable-pip-version-check pillow reportlab

      - name: Build web app, site and iOS resources
        run: python3 tools/build.py

      - name: Data integrity tests
        run: python3 -m unittest discover -s tests -v

      - name: Routing engine and ad tests
        run: node --test tests/engine.test.mjs tests/ads.test.mjs tests/admin.test.mjs

      - name: Script syntax check
        run: |
          python3 - <<'EOF'
          import re, subprocess, sys
          code = 0
          for i, page in enumerate(["dist/index.html", "dist/site/admin/index.html"]):
              html = open(page, encoding="utf-8").read()
              js = re.search(r"<script>(.*)</script>", html, re.S).group(1)
              open(f"/tmp/page{i}.js", "w", encoding="utf-8").write(js)
              code |= subprocess.call(["node", "--check", f"/tmp/page{i}.js"])
          sys.exit(code)
          EOF

      - name: Generated iOS resources are committed and current
        run: |
          # ads.json in the app is only a fallback (the app reads the live feed), and the admin page
          # commits data/ads.json without rebuilding, so it is left out of this check.
          git diff --exit-code -- ios/Masar/Resources ':!ios/Masar/Resources/ads.json' \
            || (echo "::error::Run 'python3 tools/build.py' and commit ios/Masar/Resources" && exit 1)
