name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Data, engine and build checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependency (icons)
        run: pip install --disable-pip-version-check pillow

      - name: Build web app, site and iOS resources
        run: python3 tools/build.py

      - name: Data integrity tests
        run: python3 -m unittest discover -s tests -v

      - name: Routing engine and ad tests
        run: node --test tests/engine.test.mjs tests/ads.test.mjs

      - name: Script syntax check
        run: |
          python3 - <<'EOF'
          import re, subprocess, sys
          html = open("dist/index.html", encoding="utf-8").read()
          js = re.search(r"<script>(.*)</script>", html, re.S).group(1)
          open("/tmp/app.js", "w", encoding="utf-8").write(js)
          sys.exit(subprocess.call(["node", "--check", "/tmp/app.js"]))
          EOF

      - name: Generated iOS resources are committed and current
        run: |
          git diff --exit-code -- ios/Masar/Resources \
            || (echo "::error::Run 'python3 tools/build.py' and commit ios/Masar/Resources" && exit 1)
