name: Domain availability probe (temporary)
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: RDAP lookup
        run: |
          for d in masarmetro.com masar-metro.com masarriyadh.com masarapp.com getmasar.com ridemasar.com masarksa.com masarmetroapp.com usemasar.com masar.app masarmetro.app; do
            case "$d" in *.com) url="https://rdap.verisign.com/com/v1/domain/$d";; *.app) url="https://pubapi.registry.google/rdap/domain/$d";; esac
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' --max-time 15 "$url")
            if [ "$code" = 404 ]; then st=AVAILABLE
            elif [ "$code" = 200 ]; then
              st="TAKEN reg=$(jq -r '[.events[]?|select(.eventAction=="registration")|.eventDate][0]' /tmp/r.json) exp=$(jq -r '[.events[]?|select(.eventAction=="expiration")|.eventDate][0]' /tmp/r.json)"
            else st="UNKNOWN http=$code"; fi
            echo "::notice title=$d::$st"
          done
