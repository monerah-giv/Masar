<title>مخطط رحلات مترو الرياض</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
/* Layout: phone-width app column — brand bar, green route hero, one scrolling view per tab, fixed tab bar.
   Identity: one monoline octilinear system; the gold dot means "arrival". */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --soft:#E3ECE8; --ink:#0B1A22; --muted:#51635D; --rule:#D3DED9;
  --accent:#00795C; --accent-ink:#FFFFFF; --accent-soft:#D6EEE5;
  --gold:#F6B53C; --gold-ink:#2B1C00; --gold-soft:#FCEFD2;
  --hero:#00805F; --hero-2:#00684E; --hero-ink:#FFFFFF; --hero-field:#FFFFFF; --hero-field-ink:#0B1A22; --hero-muted:#51635D;
  --warn:#8F5300; --warn-bg:#FBEFD9; --danger:#B3261E;
  --l1:#0A78C8; --l2:#D3242C; --l3:#E5730F; --l4:#E2AA00; --l5:#2C9A47; --l6:#7A3A96; --on-line:#FFFFFF; --l4-ink:#1D1600;
  --shadow:0 1px 2px rgba(11,26,34,.06),0 10px 28px rgba(11,26,34,.07);
  --f-display:"Readex Pro","IBM Plex Sans Arabic","Noto Sans Devanagari","Noto Sans Bengali",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Noto Sans Devanagari","Noto Sans Bengali","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08141A; --surface:#0F2129; --soft:#16303A; --ink:#E6F0EC; --muted:#93AAA3; --rule:#21404A;
    --accent:#34C495; --accent-ink:#03140E; --accent-soft:#0F3B2F;
    --gold:#FFC65A; --gold-ink:#2B1C00; --gold-soft:#3A2D10;
    --hero:#0D5543; --hero-2:#093E31; --hero-ink:#FFFFFF; --hero-field:#0F2129; --hero-field-ink:#E6F0EC; --hero-muted:#93AAA3;
    --warn:#F2B85B; --warn-bg:#2B2210; --danger:#FF8A80;
    --l1:#3A9FEA; --l2:#EF5258; --l3:#F5964A; --l4:#F4C733; --l5:#4DC16B; --l6:#B47BD0;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08141A; --surface:#0F2129; --soft:#16303A; --ink:#E6F0EC; --muted:#93AAA3; --rule:#21404A;
  --accent:#34C495; --accent-ink:#03140E; --accent-soft:#0F3B2F;
  --gold:#FFC65A; --gold-ink:#2B1C00; --gold-soft:#3A2D10;
  --hero:#0D5543; --hero-2:#093E31; --hero-ink:#FFFFFF; --hero-field:#0F2129; --hero-field-ink:#E6F0EC; --hero-muted:#93AAA3;
  --warn:#F2B85B; --warn-bg:#2B2210; --danger:#FF8A80;
  --l1:#3A9FEA; --l2:#EF5258; --l3:#F5964A; --l4:#F4C733; --l5:#4DC16B; --l6:#B47BD0;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root[data-contrast="high"]{ --muted:var(--ink); --rule:var(--ink); --hero-muted:var(--hero-field-ink); --shadow:none }
html{font-size:15px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
:root[lang="zh"] body{line-height:1.7}
.app{max-width:540px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.35;text-wrap:balance}
h2{font-size:1.06rem;font-weight:800}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
:root[data-contrast="high"] :focus-visible{outline-width:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:1.3rem;height:1.3rem;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* top bar: brand lockup */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px}
.sym{width:38px;height:38px;flex:none;display:block}
.sym svg{width:100%;height:100%;display:block}
.brand{flex:1;min-width:0;line-height:1.15;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.wm{display:block;height:30px;color:var(--ink)}
.wm svg{height:100%;width:auto;display:block}
.brand small{color:var(--muted);font-size:.74rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;font-family:var(--f-display)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.off{background:var(--warn-bg);color:var(--warn)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--rule);background:var(--surface);display:inline-grid;place-items:center;flex:none}
.langbtn{width:auto;padding:0 10px;gap:6px;display:inline-flex;align-items:center;font-weight:600;font-size:.8rem}

/* generic */
.view{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.card-h{padding:14px 16px 6px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between}
.card-h p{margin:0;color:var(--muted);font-size:.84rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:10px 8px;border-radius:9px;font-weight:600;color:var(--muted);min-height:44px}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
:root[data-contrast="high"] .seg button[aria-checked="true"]{outline:2px solid var(--ink)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:11px 16px;border-radius:12px;font-weight:700;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--rule);color:var(--ink)}
.switch{width:52px;height:32px;border-radius:16px;border:0;background:var(--rule);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{inset-inline-start:23px}
.empty{color:var(--muted);font-size:.9rem;padding:4px 16px 16px;margin:0}

/* planner hero: green route card with an origin→destination spine */
.hero{position:relative;overflow:hidden;background:linear-gradient(170deg,var(--hero),var(--hero-2));color:var(--hero-ink);border-radius:24px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:1.4rem;letter-spacing:-.005em;position:relative}
.hero-deco{position:absolute;inset-inline-end:-46px;top:-40px;width:190px;height:190px;opacity:.13;pointer-events:none}
[dir="rtl"] .hero-deco{transform:scaleX(-1)}
.od{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:stretch;position:relative}
.spine{display:flex;flex-direction:column;align-items:center;padding-block:21px}
.spine .o{width:11px;height:11px;border-radius:50%;background:var(--hero-ink);flex:none}
.spine .l{flex:1;width:3px;background:linear-gradient(var(--hero-ink),var(--gold));opacity:.9;margin-block:3px;border-radius:2px}
.spine .d{width:18px;height:18px;border-radius:50%;border:3.5px solid var(--hero-ink);background:radial-gradient(circle,var(--gold) 0 3.6px,transparent 4.2px);flex:none}
.fields{display:flex;flex-direction:column;gap:8px;min-width:0}
.field{position:relative}
.field label{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);font-size:.74rem;color:var(--muted);font-weight:700;pointer-events:none;max-width:52px;overflow:hidden;white-space:nowrap}
.field input{width:100%;font-size:16px;background:var(--soft);color:var(--ink);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;padding-inline-start:66px;min-height:52px}
.field input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.field input::placeholder{color:var(--muted)}
.hero .field label{color:var(--hero-muted)}
.hero .field input{background:var(--hero-field);color:var(--hero-field-ink);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.hero .field input:focus{border-color:var(--gold);background:var(--hero-field)}
.hero .field input::placeholder{color:var(--hero-muted)}
.swapcol{display:flex;align-items:center}
.hero .iconbtn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:var(--hero-ink)}
.hero .seg{background:rgba(0,0,0,.2)}
.hero .seg button{color:rgba(255,255,255,.82)}
.hero .seg button[aria-checked="true"]{background:var(--hero-field);color:var(--hero-field-ink)}
.hero :focus-visible{outline-color:var(--gold)}
.dd{color:var(--ink);position:absolute;inset-inline:0;top:calc(100% + 4px);z-index:25;background:var(--surface);border:1px solid var(--rule);border-radius:12px;max-height:300px;overflow:auto;box-shadow:0 14px 36px rgba(0,0,0,.18);padding:4px;margin:0;list-style:none}
.dd li{padding:10px;border-radius:9px;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:44px}
.dd li[aria-selected="true"],.dd li:hover{background:var(--soft)}
.dd .nm{flex:1;min-width:0;line-height:1.35}
.dd .alt{display:block;font-size:.76rem;color:var(--muted)}
.dd .none{color:var(--muted);cursor:default}
.dots{display:inline-flex;gap:3px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.hero .pchip{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.26);color:var(--hero-ink)}
.hero .pchip svg.i{color:var(--gold)}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:7px 12px;white-space:nowrap;font-weight:600;font-size:.86rem;min-height:40px}
.pchip svg.i{width:1.05rem;height:1.05rem;color:var(--accent)}
.when{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.when input[type="time"]{background:var(--hero-field);color:var(--hero-field-ink);border:1.5px solid transparent;border-radius:12px;padding:10px;min-height:44px;font-size:16px}
.when input[type="time"]:focus{outline:none;border-color:var(--gold)}

/* result */
.result{display:flex;flex-direction:column;gap:12px}
.summary{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 18px}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(2.8rem,13vw,3.6rem);line-height:.95;color:var(--accent);letter-spacing:-.02em}
.big small{font-size:.32em;font-weight:600;margin-inline-start:6px;color:var(--muted);letter-spacing:0}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--rule);font-size:.84rem;font-weight:600}
.eta{color:var(--muted);font-size:.9rem;width:100%;margin:0}
.eta.warn{color:var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1 1 140px;min-width:0}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.alt-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.alt-row button{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:9px;padding:6px 12px;font-weight:700;min-height:36px}
.msg{background:var(--surface);border:1px dashed var(--rule);border-radius:var(--r);padding:18px;color:var(--muted);margin:0}
.ribbon{display:flex;align-items:flex-start;margin-top:16px}
.ribbon .o{width:12px;height:12px;border-radius:50%;background:var(--ink);flex:none;margin-top:5px}
.ribbon .x{width:17px;height:17px;border-radius:50%;border:3.5px solid var(--ink);background:var(--surface);flex:none;margin-top:2.5px;margin-inline:-2px;position:relative;z-index:1}
.ribbon .d{width:23px;height:23px;border-radius:50%;border:4px solid var(--ink);background:radial-gradient(circle,var(--gold) 0 4.6px,var(--surface) 5.2px);flex:none;margin-inline-start:-2px;position:relative;z-index:1}
.rleg{display:flex;flex-direction:column;gap:6px;min-width:46px}
.rleg .bar{height:8px;margin-top:7px;background:var(--c);border-radius:0}
.rleg:first-of-type .bar{border-start-start-radius:4px;border-end-start-radius:4px}
.rleg .lab{display:flex;align-items:center;gap:4px;font-size:.74rem;color:var(--muted);padding-inline:4px;white-space:nowrap;overflow:hidden}
.rleg .lab .roundel{min-width:20px;height:20px;font-size:.72rem;padding:0 5px}
.journey{list-style:none;margin:0;padding:14px 16px;display:flex;flex-direction:column}
.journey>li{position:relative;padding-inline-start:32px}
.node{padding-block:6px}
.node::before{content:"";position:absolute;inset-inline-start:5px;top:12px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3.5px solid var(--ink)}
.node b{font-weight:700}
.node .sub{display:block;color:var(--muted);font-size:.84rem}
.node .alt{color:var(--muted);font-size:.8rem;margin-inline-start:8px;display:inline-block}
.node.xfer{background:var(--soft);border-radius:12px;margin-block:4px;padding-block:9px;padding-inline-end:10px}
.node.xfer::before{top:14px}
.node.orig::before{background:var(--ink);width:14px;height:14px;inset-inline-start:6px;top:13px;border-width:0}
.node.dest::before{width:20px;height:20px;inset-inline-start:3px;top:10px;border-width:4px;background:radial-gradient(circle,var(--gold) 0 3.8px,var(--surface) 4.4px)}
.leg{padding-block:9px 11px}
.leg::before{content:"";position:absolute;inset-inline-start:10px;top:0;bottom:0;width:6px;border-radius:3px;background:var(--c)}
.leghead{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.roundel{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--c);color:var(--on-line);font-weight:700;font-size:.84rem;flex:none}
.roundel.y{color:var(--l4-ink)}
.leg .meta{color:var(--muted);font-size:.86rem}
.leg .also{font-size:.82rem;color:var(--muted)}
details.stops summary{cursor:pointer;color:var(--accent);font-size:.84rem;font-weight:700;margin-top:2px;list-style:none;min-height:32px;display:flex;align-items:center}
details.stops summary::-webkit-details-marker{display:none}
details.stops ol{margin:4px 0 0;padding-inline-start:18px;color:var(--muted);font-size:.86rem}

/* one-tap inputs */
details.manual>summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:.88rem;padding:6px 0;min-height:40px;display:flex;align-items:center}
details.manual[open]>summary{margin-bottom:8px}
.field.has-btn input{padding-inline-end:56px}
.field input{text-overflow:ellipsis}
.inbtn{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;z-index:1}
.inbtn svg.i{width:1.25rem;height:1.25rem}
.inbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.result{scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
#sumcard{scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:no-preference){
  .fresh{animation:fresh .7s ease-out}
  @keyframes fresh{0%{box-shadow:0 0 0 0 var(--accent-soft),var(--shadow);transform:translateY(4px)}60%{box-shadow:0 0 0 8px var(--accent-soft),var(--shadow)}100%{box-shadow:var(--shadow);transform:none}}
}
/* current location */
.dd li.here{border-bottom:1px solid var(--soft);margin-bottom:2px}
.dd li.here .pin{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.dd li.here .pin svg.i{width:1.05rem;height:1.05rem}
.node.here::before{background:var(--accent);border-color:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.ribbon .y{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2.5px solid var(--surface);box-shadow:0 0 0 2px var(--accent-soft);flex:none;margin-top:4px;box-sizing:border-box}
.rwalk .bar{height:4px !important;margin-top:9px !important;background:repeating-linear-gradient(90deg,var(--muted) 0 3px,transparent 3px 8px) !important}
.rwalk .lab svg.i{width:.95rem;height:.95rem}
.chip svg.i{width:1rem;height:1rem}
/* location */
.herorow{display:flex;gap:8px;align-items:center;min-width:0}
.herorow .chips{flex:1;min-width:0}
.locbtn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:7px 13px;min-height:40px;font-weight:700;font-size:.86rem;white-space:nowrap;flex:none;background:var(--hero-field);color:var(--hero-field-ink)}
.locbtn svg.i{width:1.1rem;height:1.1rem;color:var(--accent)}
.near{padding:4px 8px 8px}
.near li{flex-wrap:wrap}
.near .rowbtn{flex:1 1 150px}
.near .grow small{white-space:nowrap}
.near .ico{background:var(--soft);color:var(--ink)}
.near .go{display:flex;gap:6px;flex:none}
.near .go a,.near .go button{min-height:40px;min-width:40px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;font-size:.8rem;font-weight:700;text-decoration:none}
.near .go button{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.maplinks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.maplinks a{text-decoration:none}
.walklink{display:inline-flex;align-items:center;gap:4px;margin-top:4px;color:var(--accent);font-weight:700;font-size:.84rem;text-decoration:none}
.walklink svg.i{width:1rem;height:1rem}
.locerr{color:var(--danger);font-size:.86rem;margin:0}
.loclabel{font-size:.84rem;font-weight:600;color:var(--muted)}
.loctxt{width:100%;font-size:16px;background:var(--soft);color:var(--ink);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;min-height:48px;direction:ltr;text-align:start}
.loctxt:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.card-h .seg button{min-height:36px;padding:6px 10px;font-size:.8rem}
.maphint{margin:0;padding:0 16px 6px;color:var(--muted);font-size:.82rem}
.here-dot{fill:var(--accent);stroke:var(--surface);stroke-width:4}
.here-halo{fill:var(--accent);opacity:.18}
@media (prefers-reduced-motion:no-preference){.here-halo{animation:halo 2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes halo{from{transform:scale(.4);opacity:.35}to{transform:scale(1.4);opacity:0}}}
.geo-grid{stroke:var(--rule);stroke-width:1;opacity:.7}
.scale-t{font-family:var(--f-body);font-size:16px;fill:var(--muted)}
/* map */
.mapbox{overflow-x:auto;direction:ltr;-webkit-overflow-scrolling:touch}
.mapbox svg{display:block;width:100%;min-width:600px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 16px 12px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:6px;border-radius:3px}
.hit{cursor:pointer}
.base.dim{opacity:.22}

<script>
(function(){

const APP = /*APP*/null;

/* ---------- state ---------- */
const KEY = "masar.v1";
const st = {
  tab: "plan", from: "t12", to: "qasrhokm", mode: "fast", depAt: "",

}
const uid = () => Math.random().toString(36).slice(2,10);

/* ---------- account sync (claude.ai identity + per-user db doc) ---------- */
const Sync = {ref:null, status:"local", name:"", avatar:"", writing:false, pending:false, timer:0};

/* ---------- routing: one seeded search over (station, line) states ----------
   Riding costs the line's hop time; changing line costs XFER and one transfer. Sources start with their
   walking minutes and sinks add theirs on arrival, so "walk to any nearby station, ride" is a single pass. */
function hpush(h, e){ h.push(e); let i = h.length - 1; while(i > 0){ const p = (i - 1) >> 1; if(h[p].s <= e.s) break; h[i] = h[p]; i = p; } h[i] = e; }
function hpop(h){
  if(!h.length) return null;
  const top = h[0], last = h.pop();
  if(h.length){
    let i = 0; const n = h.length;
    for(;;){
      const l = 2*i + 1, r = l + 1; let m = -1, ms = last.s;
      if(l < n && h[l].s < ms){ m = l; ms = h[l].s; }
      if(r < n && h[r].s < ms){ m = r; }
      if(m < 0) break;
      h[i] = h[m]; i = m;
    }
    h[i] = last;
  }
  return top;
}
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function search(sources, sinks, mode){
  const sc = (tm, x) => mode === "few" ? x*10000 + tm : tm + x*0.001;
  const best = new Map(), prev = new Map(), done = new Set(), h = [];
  for(const id in sources) if(own(sources, id)) for(const l of at[id] || []){
    const k = id+"@"+l, tm = sources[id], s0 = sc(tm, 0);
    if(s0 < (best.has(k) ? best.get(k) : Infinity)){ best.set(k, s0); hpush(h, {s: s0, k, t: tm, x: 0}); }
  }
  let e;
  while((e = hpop(h))){
    if(e.arrive){ const path = [e.k]; let k = e.k; while(prev.has(k)){ k = prev.get(k); path.push(k); } return path.reverse(); }
    if(done.has(e.k)) continue;
    done.add(e.k);
    const parts = e.k.split("@"), sid = parts[0], lid = +parts[1];
    if(own(sinks, sid)) hpush(h, {s: sc(e.t + sinks[sid], e.x), k: e.k, t: e.t + sinks[sid], x: e.x, arrive: true});
    const L = LBY[lid], i = L.stations.indexOf(sid), nb = [];
    if(i > 0) nb.push([L.stations[i-1]+"@"+lid, L.hop, 0]);
    if(i < L.stations.length-1) nb.push([L.stations[i+1]+"@"+lid, L.hop, 0]);
    at[sid].forEach(o => { if(o !== lid) nb.push([sid+"@"+o, XFER, 1]); });
    for(const [k, dt, dx] of nb){
      if(done.has(k)) continue;
      const tm = e.t + dt, x = e.x + dx, s1 = sc(tm, x);
      if(s1 < (best.has(k) ? best.get(k) : Infinity)){ best.set(k, s1); prev.set(k, e.k); hpush(h, {s: s1, k, t: tm, x}); }
    }
  }
  return null;
}
const RCACHE = new Map();   /* the network never changes, so station-to-station answers are cached */
function route(from, to, mode){
  if(!from || !to || from === to) return null;
  const key = from+">"+to+">"+mode;
  if(RCACHE.has(key)) return RCACHE.get(key);
  const p = search({[from]: 0}, {[to]: 0}, mode), r = p ? build(p) : null, out = r && r.legs.length ? r : null;
  RCACHE.set(key, out);
  return out;
}
function build(path){
  const legs = [];
  path.forEach(k => {
    const p = k.split("@"), sid = p[0], lid = +p[1], last = legs[legs.length-1];
    if(last && last.line === lid) last.stops.push(sid); else legs.push({line: lid, stops: [sid]});
  });
  const L2 = legs.filter(g => g.stops.length > 1);
  L2.forEach(g => {
    const L = LBY[g.line], a = L.stations.indexOf(g.stops[0]), b = L.stations.indexOf(g.stops[g.stops.length-1]);
    g.toward = b > a ? L.stations[L.stations.length-1] : L.stations[0];
    g.n = g.stops.length - 1; g.min = g.n * L.hop;
    const other = g.line === 4 ? 6 : g.line === 6 ? 4 : 0;
    g.also = other && g.stops.every(s => at[s].includes(other)) ? other : 0;
  });
  if(!L2.length) return {legs: [], xfers: 0, total: 0, stops: 0};
  const ride = L2.reduce((a,g) => a + g.min, 0), x = L2.length - 1;
  return {legs: L2, xfers: x, total: WAIT0 + ride + x*XFER, stops: L2.reduce((a,g) => a + g.n, 0)};
}

/* Trip from a station, or door-to-door from the current location. Every station within walking reach
   is seeded with its walking time and the search runs once, so a farther station on a direct line wins. */
const MAX_WALK = 2500;
function planTrip(mode){
  if(st.fromHere && st.here){
    if(!st.to) return null;
    const near = nearestTo(st.here, 4), reach = near.filter(n => n.m <= MAX_WALK), cands = reach.length ? reach : near.slice(0, 1);
    const src = {}; cands.forEach(c => { src[c.id] = walkMin(c.m); });
    const p = search(src, {[st.to]: 0}, mode); if(!p) return null;
    const r = build(p), first = p[0].split("@")[0], acc = cands.find(c => c.id === first), w = src[first];
    const ride = r.legs.length ? r : null;
    return {r: ride, access: acc, walk: w, total: w + (ride ? ride.total : 0), xfers: ride ? ride.xfers : 0};
  }
  if(!st.from || !st.to || st.from === st.to) return null;
  const r = route(st.from, st.to, mode);
  return r ? {r, access: null, walk: 0, total: r.total, xfers: r.xfers} : null;
}

function ribbon(r, walk){
  const parts = (walk ? [t("walk_info",{m: minTxt(walk), d: ""}).replace(/\s*·\s*$/, "")] : []).concat(r.legs.map(g => lineName(g.line)+" "+minTxt(g.min)));

  if(walk) h += '<span class="y"></span><div class="rleg rwalk" style="flex:'+Math.max(1, walk).toFixed(2)+' 1 0"><span class="bar"></span><span class="lab" aria-hidden="true">'+ICON.walk+'<span class="num">'+fmtNum(Math.round(walk))+'</span></span></div>';
  h += '<span class="o"></span>';

    h += '<div class="rleg" style="flex:'+Math.max(1, g.min).toFixed(2)+' 1 0;--c:var(--l'+g.line+')"><span class="bar"></span><span class="lab" aria-hidden="true">'+roundel(g.line)+'<span class="num">'+fmtNum(Math.round(g.min))+'</span></span></div>';

const SPEECH_LANG = {ar:"ar-SA", en:"en-US", ur:"ur-PK", hi:"hi-IN", bn:"bn-IN", fil:"fil-PH", id:"id-ID", zh:"zh-CN"};
function speakTrip(text, eta){
  const ss = window.speechSynthesis; if(!ss) return;
  if(ss.speaking){ ss.cancel(); refreshPlan(); return; }
  const lines = text.split("\n").map(l => l.replace(/^\s*\d+\.\s*/, "").replace(/→/g, " ، ").trim()).filter(Boolean);
  lines.splice(2, 0, eta);
  const u = new SpeechSynthesisUtterance(lines.join(". "));
  u.lang = SPEECH_LANG[lang] || "en-US"; u.rate = 0.95;
  const v = ss.getVoices().find(x => x.lang && x.lang.toLowerCase().startsWith(u.lang.slice(0,2).toLowerCase())); if(v) u.voice = v;
  u.onend = u.onerror = () => { if(st.tab === "plan") refreshPlan(); };
  ss.speak(u); setTimeout(refreshPlan, 60);
}
function tripText(r, T, acc, walk){
  const lines = [t("app_name")+": "+(acc ? t("cur_loc") : nm(st.from))+" → "+nm(st.to), minTxt(T)+" · "+xferTxt(r.xfers)];
  if(acc) lines.push("0. "+t("walk_to",{st: nm(acc.id)})+" ("+minTxt(walk)+")");
  r.legs.forEach((g, i) => {
    lines.push((i+1)+". "+t("ride",{line: lineName(g.line), st: nm(g.toward)})+" ("+pl("p_stop", g.n)+")");
    if(i < r.legs.length-1) lines.push("   "+t("change_at",{st: nm(g.stops[g.stops.length-1])}));

}

/* ---------- map ---------- */
const shared = new Set(["kafd","rabi","uthman","sabic"]);
/* City map: equirectangular projection around Riyadh, fitted to a 1000-unit-wide box. */
const GEO = (() => {
  const lats = NET.stations.map(s => s.lat), lngs = NET.stations.map(s => s.lng), pad = 0.03;
  const minLat = Math.min(...lats) - pad, maxLat = Math.max(...lats) + pad, minLng = Math.min(...lngs) - pad, maxLng = Math.max(...lngs) + pad;
  const kx = Math.cos((minLat + maxLat) / 2 * Math.PI / 180), scale = 1000 / ((maxLng - minLng) * kx);
  return { W: 1000, H: Math.round((maxLat - minLat) * scale), scale, minLat, maxLat, minLng, maxLng,
    p: (lat, lng) => [+((lng - minLng) * kx * scale).toFixed(1), +((maxLat - lat) * scale).toFixed(1)] };
})();
const geoMode = () => st.prefs.mapMode === "geo";
const xy = id => geoMode() ? GEO.p(S[id].lat, S[id].lng) : [S[id].x, S[id].y];
function pt(id, line){ const p = xy(id); if(!geoMode() && shared.has(id)){ if(line === 4) return [p[0], p[1]-5]; if(line === 6) return [p[0], p[1]+5]; } return p; }
const LABEL = {sabb:[16,6,"start"], kafd:[-18,6,"end"], stc:[-18,-12,"end"], museum:[-18,6,"end"], qasrhokm:[-16,-16,"end"], moe:[0,-20,"middle"], hamra:[14,-16,"start"], naseem:[0,34,"middle"], sabic:[0,-20,"middle"], darbaida:[-16,6,"end"], ksu:[0,-20,"middle"], kfstadium:[0,32,"middle"], jeddahrd:[0,-18,"start"], khashm:[0,-18,"end"], t12:[-16,6,"end"]};
function label(id, key){
  const p = xy(id), L = (!geoMode() && LABEL[id]) || (p[0] > 500 ? [-14,-12,"end"] : [14,-12,"start"]);
  return '<text class="lbl'+(key?' k':'')+'" x="'+(p[0]+L[0])+'" y="'+(p[1]+L[1])+'" text-anchor="'+L[2]+'">'+esc(nm(id))+'</text>';
}
function drawMap(){
  const geo = geoMode(), W = 1000, H = geo ? GEO.H : 980;
  let lines = "", sts = "", lbls = "", hits = "", under = "";
  if(geo){
    for(let la = Math.ceil(GEO.minLat*20)/20; la < GEO.maxLat; la += 0.05){ const y = GEO.p(la, GEO.minLng)[1]; under += '<line class="geo-grid" x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'"/>'; }
    for(let ln = Math.ceil(GEO.minLng*20)/20; ln < GEO.maxLng; ln += 0.05){ const x = GEO.p(GEO.minLat, ln)[0]; under += '<line class="geo-grid" y1="0" y2="'+H+'" x1="'+x+'" x2="'+x+'"/>'; }

/* ---------- location: nearest station + hand-off to Google / Apple Maps ---------- */
const isApprox = id => !["official","ref"].includes(S[id].geo);
const inRiyadh = (lat, lng) => lat > 24.3 && lat < 25.3 && lng > 46.2 && lng < 47.3;
function metres(a, b){
  const R = 6371000, r = Math.PI/180, dLat = (b.lat-a.lat)*r, dLng = (b.lng-a.lng)*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function nearestTo(p, n){
  return NET.stations.map(s => ({id: s.id, m: metres(p, s)})).sort((a,b) => a.m - b.m).slice(0, n || 3);
}
const walkMin = m => m * 1.25 / 80;                     /* streets ~25% longer than the straight line, 80 m/min */
const distTxt = m => m < 1000 ? t("m_unit",{n: fmtNum(Math.round(m/10)*10)}) : t("km",{n: fmtNum(Math.round(m/100)/10)});
const ll = p => p.lat.toFixed(6)+","+p.lng.toFixed(6);
/* With no origin both apps start from the device's own location. */
function gmapsURL(id, from){ return "https://www.google.com/maps/dir/?api=1"+(from ? "&origin="+ll(from) : "")+"&destination="+ll(S[id])+"&travelmode=walking"; }
function amapsURL(id, from){ return "https://maps.apple.com/?"+(from ? "saddr="+ll(from)+"&" : "")+"daddr="+ll(S[id])+"&dirflg=w"; }
function walkLinkHTML(id){
  if(!st.here) return "";
  const m = metres(st.here, S[id]);
  return '<a class="walklink" href="'+esc(gmapsURL(id, st.here))+'" target="_blank" rel="noopener">'+ICON.walk+esc(t("walk_to",{st: nm(id)}))+' · '+esc((isApprox(id)?"~ ":"")+t("walk_info",{m: minTxt(walkMin(m)), d: distTxt(m)}))+'</a>';
}
function parseLoc(raw){
  const s = String(raw || "").replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/٫/g, ".").trim();
  const pats = [/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /@(-?\d+\.\d+),\s*(-?\d+\.\d+)/,
    /[?&](?:q|query|ll|destination|daddr|saddr|center|sll)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i,
    /(-?\d{1,2}\.\d{2,})\s*[,،\s]\s*(-?\d{1,3}\.\d{2,})/];
  for(const re of pats){
    const m = s.match(re); if(!m) continue;
    const a = +m[1], b = +m[2];
    if(inRiyadh(a, b)) return {lat: a, lng: b};
    if(inRiyadh(b, a)) return {lat: b, lng: a};
  }
  return null;
}
function setHere(p, quiet){
  st.here = p; st.hereAt = Date.now();                  /* kept in memory only, never saved */
  st.fromHere = true; st.scrollNext = !quiet;           /* the trip now starts at the user's location */
  if(!st.prefs.autoHere){ st.prefs.autoHere = true; persist(); }   /* remember the choice, not the place */
  const lb = $("locbtn"); if(lb) lb.setAttribute("aria-pressed", "true");
  $("toast").hidden = true;
  const f = $("f-from"); if(f) f.value = t("cur_loc");
  renderNearby(); drawMap(); refreshPlan();
  const box = $("nearby"); if(!quiet && box && box.scrollIntoView) try{ box.scrollIntoView({behavior:"smooth", block:"nearest"}); }catch(e){}
}
/* Open already located: when the browser has granted location (or the user chose "Current location"
   last time), locate silently on load. Where the page can't read location (inside Claude) this simply
   does nothing and the From field keeps the last station. */
function autoLocate(){
  if(!navigator.geolocation) return;
  const run = () => {
    try{
      navigator.geolocation.getCurrentPosition(pos => {
        const p = {lat: pos.coords.latitude, lng: pos.coords.longitude};
        if(inRiyadh(p.lat, p.lng) && st.tab === "plan" && !st.fromHere) setHere(p, true);
      }, () => {}, {enableHighAccuracy: true, timeout: 10000, maximumAge: 120000});
    }catch(e){}
  };
  try{
    if(navigator.permissions && navigator.permissions.query){
      navigator.permissions.query({name: "geolocation"}).then(r => {
        if(r.state === "granted" || (st.prefs.autoHere && r.state === "prompt")) run();
      }, () => { if(st.prefs.autoHere) run(); });
    } else if(st.prefs.autoHere) run();
  }catch(e){}
}
/* "Current location" in the From list, or the Nearest-station button. */
function useHere(){
  if(st.here && Date.now() - (st.hereAt || 0) < 120000){ setHere(st.here); return; }
  locate();
}
function locate(){
  let settled = false;
  const fallback = () => { if(settled) return; settled = true; $("toast").hidden = true; openLocSheet(); };
  if(!navigator.geolocation){ fallback(); return; }
  toast(t("locating"));
  const timer = setTimeout(fallback, 5000);
  try{
    navigator.geolocation.getCurrentPosition(pos => {
      if(settled) return; settled = true; clearTimeout(timer);
      const p = {lat: pos.coords.latitude, lng: pos.coords.longitude};
      if(inRiyadh(p.lat, p.lng)) setHere(p); else { settled = false; fallback(); }
    }, () => { clearTimeout(timer); fallback(); }, {enableHighAccuracy: true, timeout: 4500, maximumAge: 60000});
  }catch(e){ clearTimeout(timer); fallback(); }
}
function openLocSheet(){
  /* Inside Claude the page can't read location. If the standalone site is published, one tap opens it
     in the browser, which locates automatically; typing a location stays available as a fallback. */
  let site = APP && APP.siteUrl ? APP.siteUrl : "";
  try{ if(site && new URL(site, location.href).origin === location.origin) site = ""; }catch(e){}   /* already on the site */
  const form = '<form id="locform" class="stack"><label class="loclabel" for="locin">'+esc(t("loc_web_ph")).replace("24.7136, 46.6753", '<bdi dir="ltr">24.7136, 46.6753</bdi>')+'</label>'+
    '<input class="loctxt" id="locin" type="text" dir="ltr" inputmode="url" autocomplete="off" spellcheck="false" placeholder="24.7136, 46.6753">'+
    '<p class="locerr" id="locerr" role="alert" hidden></p>'+

    (site ? '' : '<a class="btn line" href="https://www.google.com/maps" target="_blank" rel="noopener">'+esc(t("open_gmaps"))+ICON.ext+'</a>')+'</form>';
  openSheet('<h3>'+esc(t("loc_web_title"))+'</h3>'+
    (site
      ? '<p class="sub">'+esc(t("loc_site_body"))+'</p><a class="btn" href="'+esc(site)+'" target="_blank" rel="noopener">'+ICON.loc+esc(t("open_site"))+'</a>'+
        '<details class="manual"><summary>'+esc(t("paste_manual"))+'</summary>'+form+'</details>'

function renderNearby(){
  const box = $("nearby"); if(!box) return;
  if(!st.here){ box.innerHTML = ""; return; }

  box.innerHTML = '<div class="card"><div class="card-h"><h2>'+esc(t("nearest_title"))+'</h2>'+(near.some(n => isApprox(n.id)) ? '<p>'+esc(t("approx_pos"))+'</p>' : '')+'</div>'+

/* ---------- ads: sponsored places near stations ----------
   Contextual only: an ad is chosen by the station the rider is heading to, never by who the rider is.
   Campaigns, tiers and prices live in data/ads.json; the site also serves it as ads.json for the iOS app. */
const ADS = /*ADS*/null;
const todayISO = () => new Intl.DateTimeFormat("en-CA", {timeZone: "Asia/Riyadh"}).format(new Date());
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
function hash01(s){ let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) + 0.5) / 4294967296; }
/* Active campaigns at a station: a weighted rotation (exponential race) that stays stable for the day. */
function adsAt(id, day, n){
  day = day || todayISO();
  return ADS.campaigns.filter(c => c.stations.includes(id) && c.start <= day && day <= c.end)
    .map(c => ({c, k: -Math.log(hash01(c.id + "|" + id + "|" + day)) / c.weight}))
    .sort((a, b) => a.k - b.k).slice(0, n || 1).map(x => x.c);
}
/* Slots still free at a station on every day of [a, b]. */
function freeSlots(id, a, b){
  const cs = ADS.campaigns.filter(c => c.stations.includes(id) && c.start <= b && a <= c.end);
  const days = [a].concat(cs.map(c => c.start).filter(d => d > a && d <= b));
  const peak = days.reduce((m, d) => Math.max(m, cs.filter(c => c.start <= d && d <= c.end).length), 0);
  return Math.max(0, ADS.slotsPerStation - peak);
}
const tierOf = id => ADS.tierOf[id] || "C";
function quote(pkg, target, weeks, start){
  const sts = pkg === "network" ? NET.stations.map(s => s.id) : pkg === "line" ? LBY[target].stations.slice() : [target];
  const base = sts.reduce((s, id) => s + ADS.rates[tierOf(id)], 0) * weeks;
  const dur = (ADS.durations.find(d => d.weeks === weeks) || {off: 0}).off, pk = ADS.packages[pkg] || 0;
  const net = Math.round(base * (1 - dur) * (1 - pk));
  const end = addDays(start, weeks * 7 - 1);
  const free = sts.filter(id => freeSlots(id, start, end) > 0).length;
  return {sts, base, dur, pk, net, total: Math.round(net * (1 + ADS.vat)), end, free};
}
const loc = o => !o ? "" : typeof o === "string" ? o : o[lang] != null ? o[lang] : o.en != null ? o.en : o.ar != null ? o.ar : Object.values(o)[0];
function adLink(c, id){
  try{
    const u = new URL(c.url);
    [["utm_source","masar"],["utm_medium","app"],["utm_campaign",c.id],["utm_content",id]].forEach(([k, v]) => { if(!u.searchParams.has(k)) u.searchParams.set(k, v); });
    return u.toString();
  }catch(e){ return c.url; }
}
const walkURL = (a, b) => "https://www.google.com/maps/dir/?api=1&origin="+ll(a)+"&destination="+ll(b)+"&travelmode=walking";
function adCard(c, id, preview){

    $("adv-st").onchange = e => { A.station = e.target.value; A.line = at[A.station][0]; upd(); };
    $("adv-ln").onchange = e => { A.line = +e.target.value; upd(); };
    $("adv-start").onchange = e => { if(/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) A.start = e.target.value < day ? day : e.target.value; upd(); };
    $("adv-name").oninput = e => { A.name = e.target.value.trim(); upd(); };
    $("adv-offer").oninput = e => { A.offer = e.target.value.trim(); upd(); };
    $("adv-cat").onchange = e => { A.cat = e.target.value; upd(); };
    $("sh-close").onclick = closeSheet;
    upd();
  });
  function target(){ return A.pkg === "station" ? A.station : A.pkg === "line" ? A.line : null; }
  function where(){ return A.pkg === "station" ? t("adv_station")+": "+nm(A.station) : A.pkg === "line" ? lineName(A.line) : t("pkg_network"); }
  function upd(){
    const q = quote(A.pkg, target(), A.weeks, A.start), n = q.sts.length;
    const offs = [q.dur, q.pk].filter(x => x > 0).map(x => '<span class="chip">'+esc(t("adv_off", {p: fmtNum(Math.round(x*100))}))+'</span>').join("");
    const avail = A.pkg === "station" ? freeSlots(A.station, A.start, q.end) : q.free;
    const full = A.pkg === "station" ? avail < 1 : q.free < 1;
    $("adv-quote").innerHTML = '<span class="lab">'+esc(t("adv_price"))+'</span><span class="big num">'+esc(price(q.net))+'</span>'+
      '<small>'+esc(t("adv_vat", {p: fmtNum(Math.round(ADS.vat*100))}))+' · <bdi class="num" dir="ltr">'+esc(A.start)+' → '+esc(q.end)+'</bdi></small>'+
      (A.pkg === "station" ? '<small>'+esc(t("adv_tier", {t: t("tier_"+tierOf(A.station))}))+' · '+esc(t("adv_rate", {p: price(ADS.rates[tierOf(A.station)])}))+'</small>' : '<small>'+esc(pl("p_station", n))+'</small>')+
      (offs ? '<div class="facts">'+offs+'</div>' : '')+
      (full ? '<b class="warn">'+esc(t("adv_full"))+'</b>' : '<small class="ok">'+esc(t("adv_free", {n: fmtNum(avail), m: fmtNum(A.pkg === "station" ? ADS.slotsPerStation : n)}))+'</small>');
    const prevSt = A.pkg === "station" ? A.station : q.sts[0];
    $("adv-prev").innerHTML = adCard({id: "preview", name: A.name || t("adv_sample"), category: A.cat, title: A.offer || t("adv_offer_ph"), url: "https://example.com", stations: [prevSt]}, prevSt, true);
    const msg = [t("adv_req"), "—", t("adv_biz")+": "+(A.name || "—"), t("adv_cat")+": "+t("cat_"+A.cat), t("adv_offer")+": "+(A.offer || "—"),
      t("adv_where")+" "+where(), t("adv_duration")+": "+pl("p_week", A.weeks)+" ("+A.start+" → "+q.end+")",
      t("adv_price")+": "+price(q.net)+" ("+t("adv_vat", {p: fmtNum(Math.round(ADS.vat*100))})+")"].join("\n");
    const c = ADS.contact || {}, enc = encodeURIComponent, btns = [];
    if(c.whatsapp) btns.push('<a class="btn" data-need href="https://wa.me/'+esc(String(c.whatsapp).replace(/\D/g, ""))+'?text='+esc(enc(msg))+'" target="_blank" rel="noopener">'+esc(t("adv_wa"))+'</a>');
    if(c.email) btns.push('<a class="btn'+(c.whatsapp ? ' ghost' : '')+'" data-need href="mailto:'+esc(c.email)+'?subject='+esc(enc(t("adv_req")+" — "+(A.name || "")))+'&body='+esc(enc(msg))+'">'+esc(t("adv_mail"))+'</a>');
    if(!btns.length && ADS.issueUrl) btns.push('<a class="btn" data-need href="'+esc(ADS.issueUrl+"?template=ad_request.yml&title="+enc("[Ad] "+(A.name || ""))+"&business="+enc(A.name)+"&category="+enc(t("cat_"+A.cat))+"&offer="+enc(A.offer)+"&target="+enc(where())+"&period="+enc(A.start+" → "+q.end+" ("+pl("p_week", A.weeks)+")")+"&quote="+enc(price(q.net)))+'" target="_blank" rel="noopener">'+esc(t("adv_send"))+'</a>');
    btns.push('<button type="button" class="btn ghost" id="adv-copy">'+ICON.copy+esc(t("adv_copy"))+'</button>');
    $("adv-send").innerHTML = btns.join("");
    $("adv-send").querySelectorAll("[data-need]").forEach(x => x.onclick = e => { if(!A.name){ e.preventDefault(); toast(t("adv_need_name")); $("adv-name").focus(); } });
    $("adv-copy").onclick = () => copyText(msg);
  }
}

  const recents = st.recents.length ? '<ul class="list" id="hlist">'+st.recents.map((r,i) => '<li><button type="button" class="rowbtn" data-h="'+i+'"><span class="ico">'+ICON.trip+'</span><span class="grow">'+pair(r.from, r.to)+'</span></button></li>').join("")+'</ul>' : '<p class="empty">'+esc(t("empty_recent"))+'</p>';
  return '<div class="view">'+
    '<section class="card"><div class="card-h"><h2>'+esc(t("places"))+'</h2>'+(f?'':'<button type="button" class="textbtn" id="padd">'+ICON.plus+esc(t("add_place"))+'</button>')+'</div>'+form+places+'</section>'+
    '<section class="card"><div class="card-h"><h2>'+esc(t("routes"))+'</h2></div>'+routes+'</section>'+
    '<section class="card"><div class="card-h"><h2>'+esc(t("recent"))+'</h2>'+(st.recents.length?'<button type="button" class="textbtn" id="hclear">'+esc(t("clear"))+'</button>':'')+'</div>'+recents+'</section></div>';
}
function bindSaved(){
  const v = $("view");
  const padd = $("padd"); if(padd) padd.onclick = () => { st.form = {kind: st.places.some(p => p.kind === "home") ? "other" : "home", label:"", station:""}; renderView(); };
  if(st.form){
    v.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { st.form.kind = b.dataset.kind; st.form.label = $("plabel").value; renderView(); });
    $("plabel").oninput = e => st.form.label = e.target.value;
    setupAC($("f-st"), $("dd-f-st"), () => st.form && st.form.station, id => { st.form.station = id; });
    $("psave").onclick = () => {
      const f = st.form; if(!f.station){ $("f-st").focus(); return; }
      if(f.kind !== "other") st.places = st.places.filter(p => p.kind !== f.kind);
      st.places.push({id: uid(), kind: f.kind, label: (f.label||"").trim().slice(0,40), station: f.station});
      st.places.sort((a,b) => ["home","work","other"].indexOf(a.kind) - ["home","work","other"].indexOf(b.kind));
      st.form = null; persist(); renderView(); toast(t("saved_ok"));
    };
    $("pcancel").onclick = () => { st.form = null; renderView(); };
  }
  const pl2 = $("plist"); if(pl2) pl2.onclick = e => {
    const d = e.target.closest("[data-del]"); if(d){ st.places = st.places.filter(p => p.id !== d.dataset.del); persist(); renderView(); return; }
    const g = e.target.closest("[data-go]"); if(g){ const p = st.places.find(x => x.id === g.dataset.go); if(p){ st.to = p.station; addRecent(); persist(); go("plan"); } }
  };
  const rl = $("rlist"); if(rl) rl.onclick = e => {
    const d = e.target.closest("[data-rdel]"); if(d){ st.routes = st.routes.filter(r => r.id !== d.dataset.rdel); persist(); renderView(); return; }
    const g = e.target.closest("[data-r]"); if(g){ const r = st.routes.find(x => x.id === g.dataset.r); if(r){ st.from = r.from; st.to = r.to; addRecent(); persist(); go("plan"); } }
  };
  const hl = $("hlist"); if(hl) hl.onclick = e => { const g = e.target.closest("[data-h]"); if(g){ const r = st.recents[+g.dataset.h]; if(r){ st.from = r.from; st.to = r.to; addRecent(); persist(); go("plan"); } } };
  const hc = $("hclear"); if(hc) hc.onclick = () => { st.recents = []; persist(); renderView(); };
}

function advisor(){
  const wk = 52/12, n = st.tripsWeek, opts = [];
  const p2 = tPrice("t_2h"), p7 = tPrice("t_7d"), p30 = tPrice("t_30d"), py = tPrice("t_year");
  if(p2) opts.push({id:"t_2h", m: n*wk*p2.now});
  if(p7) opts.push({id:"t_7d", m: wk*p7.now});
  if(p30) opts.push({id:"t_30d", m: p30.now});
  if(py) opts.push({id:"t_year", m: py.now/12});
  const min = Math.min(...opts.map(o => o.m)), max = Math.max(...opts.map(o => o.m));
  $("bars").innerHTML = opts.map(o => {
    const best = o.m === min;
    return '<li class="'+(best?'best':'')+'"><span class="lab">'+esc(t(o.id))+'</span><span class="track"><span class="fill" style="display:block;width:'+Math.max(18, o.m/max*100).toFixed(1)+'%"></span><span class="val num">'+esc(t("per_month",{p: price(Math.round(o.m))}))+(best?'<span class="tag">'+esc(t("best"))+'</span>':'')+'</span></span></li>';
  }).join("");
}
function bindFares(){
  $("view").querySelectorAll("[data-cls]").forEach(b => b.onclick = () => { st.prefs.fareClass = b.dataset.cls; persist(); renderView(); });
  $("elig").onclick = () => { st.prefs.discount = !st.prefs.discount; persist(); renderView(); };
  $("trips").oninput = e => { st.tripsWeek = +e.target.value; $("trips-o").textContent = fmtNum(st.tripsWeek); advisor(); };
  $("trips").onchange = () => persist();
  advisor();
}
