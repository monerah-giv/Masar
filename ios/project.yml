# XcodeGen spec — run `xcodegen generate` in this folder to create Masar.xcodeproj
name: Masar
options:
  bundleIdPrefix: app.masarmetro      # reverse of masarmetro.app; App Store bundle IDs are permanent
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""              # set by the App Store workflow from the APPLE_TEAM_ID secret
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Masar:
    type: application
    platform: iOS
    sources:
      - path: Masar
    info:
      path: Masar/Info.plist
      properties:
        CFBundleDisplayName: Masar
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [ar, en, ur, hi, bn, fil, id, zh-Hans]
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.navigation
        NSLocationWhenInUseUsageDescription: Masar uses your location to find the nearest metro station and show you on the map. Your location stays on your device.
    entitlements:
      path: Masar/Masar.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.app.masarmetro.ios]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.masarmetro.ios
        TARGETED_DEVICE_FAMILY: "1"        # iPhone; iPads run it in iPhone mode, so no iPad screenshots are needed
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  MasarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MasarTests
    dependencies:
      - target: Masar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.masarmetro.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Masar:
    build:
      targets:
        Masar: all
        MasarTests: [test]
    test:
      targets: [MasarTests]
      gatherCoverageData: true
